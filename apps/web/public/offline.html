<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06070b" />
    <title>Aura · Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        background: #06070b;
        color: #e8e9f2;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      svg {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        max-width: 280px;
        color: #9aa0b8;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 4px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: #a77bff;
        color: #06070b;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" fill="#0b0d18" />
      <path d="M248 110 C262 204 300 242 394 256 C300 270 262 308 248 402 C234 308 196 270 102 256 C196 242 234 204 248 110 Z" fill="#a77bff" />
      <path d="M364 128 C369 160 381 172 412 177 C381 182 369 194 364 226 C359 194 347 182 316 177 C347 172 359 160 364 128 Z" fill="#3ee8ff" />
      <circle cx="160" cy="364" r="13" fill="#ffc247" />
    </svg>
    <h1>You're offline</h1>
    <p>Aura needs a connection to load your quests. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
