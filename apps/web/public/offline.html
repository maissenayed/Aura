<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d0b" />
    <title>Aura · Needs a connection</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        background: #0e0d0b;
        color: #f3f0e8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      svg {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        font-stretch: 75%;
        line-height: 1;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        max-width: 280px;
        color: #aba597;
        font-size: 15px;
        line-height: 1.5;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 240px;
        margin-top: 4px;
      }
      a,
      button {
        display: block;
        padding: 12px 28px;
        border-radius: 10px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      a {
        border: 0;
        background: #f3f0e8;
        color: #0e0d0b;
      }
      button {
        border: 1px solid #3b3832;
        background: transparent;
        color: #f3f0e8;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" fill="#151411" />
      <circle cx="256" cy="256" r="150" fill="none" stroke="#edb547" stroke-width="54" stroke-linecap="round" stroke-dasharray="791.7 150.8" transform="rotate(-90 256 256)" />
      <circle cx="128.2" cy="176.5" r="27" fill="#f3f0e8" />
    </svg>
    <h1>This screen needs a connection</h1>
    <p>You're offline and this screen isn't saved on this device yet. Camp, your quests and your progress still work.</p>
    <div class="actions">
      <a href="/camp">Back to Camp</a>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
