<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aura's mark: Camp's XP ring, open on purpose, with a chalk point where you are. Gold on iron.
       The art stays inside the centre 70% so maskable crops keep it whole. -->
  <rect width="512" height="512" fill="#151411"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#edb547" stroke-width="54" stroke-linecap="round"
          stroke-dasharray="791.7 150.8" transform="rotate(-90 256 256)"/>
  <circle cx="128.2" cy="176.5" r="27" fill="#f3f0e8"/>
</svg>
