<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aura's sparkle on the app's ink. The art stays inside the centre 80% so maskable crops keep it whole. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#1c1535" />
      <stop offset="0.55" stop-color="#0b0d18" />
      <stop offset="1" stop-color="#06070b" />
    </radialGradient>
    <linearGradient id="spark" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#d8c6ff" />
      <stop offset="0.45" stop-color="#a77bff" />
      <stop offset="1" stop-color="#3ee8ff" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
